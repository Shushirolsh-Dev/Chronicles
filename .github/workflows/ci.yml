name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...
      - name: Run vet
        run: go vet ./...
      - name: Build CLI
        run: go build ./cmd/chronicle
